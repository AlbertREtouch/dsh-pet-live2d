<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Pet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#pet-root{position:fixed;inset:0}
</style>
</head>
<body>
<div id="pet-root"></div>
<!--
  Standalone page shared by the dev preview server (scripts/dev-standalone.mjs)
  and the Electron shell. `assetBase` can come from:
    1. ?assetBase=<url>   (Electron injects the in-process server port)
    2. window.dshPetDesktop (reserved for future preload-provided config)
    3. the default dev-server port below.
  Electron also passes `dshOrigin`; this page then hosts a hidden explicit
  embed-mode iframe and consumes its versioned, origin-locked state bridge.
-->
<script src="./lib/standalone.js"></script>
<script>
(() => {
	const params = new URLSearchParams(window.location.search);
	const bridge = window.dshPetDesktop ?? null;
	const assetBase =
		params.get("assetBase") ??
		bridge?.config?.assetBase ??
		"http://127.0.0.1:3410/api";
	const initialPetId = params.get("dsh-pet");
	const dshOrigin = params.get("dshOrigin");
	const desktopWindow =
		bridge !== null
			? {
					beginDrag: (offset) => bridge.beginDrag(offset),
					dragMove: () => bridge.dragMove(),
					setPetBounds: (bounds) => bridge.setPetBounds(bounds),
					dragEnd: () => bridge.dragEnd(),
					openDsh: () => bridge.openDsh(),
					requestAttention: (payload) => bridge.requestAttention(payload),
				}
			: null;
	let stateSource = null;
	if (bridge !== null && dshOrigin !== null && typeof PetStandalone.createDshBridgeStateSource === "function") {
		try {
			const frame = document.createElement("iframe");
			frame.hidden = true;
			frame.title = "DSH state bridge";
			document.body.appendChild(frame);
			stateSource = PetStandalone.createDshBridgeStateSource({
				frame,
				dshOrigin,
				parentOrigin: window.location.origin,
			});
			bridge.onDshStatus((status) => stateSource.setConnectionStatus(status));
			Promise.resolve(bridge.getDshStatus()).then((status) => {
				if (status !== null) stateSource?.setConnectionStatus(status);
			});
		} catch (error) {
			console.warn("[dsh-pet] bridge setup failed", error);
			stateSource = null;
		}
	}

	const api = PetStandalone.mount({
		target: document.getElementById("pet-root"),
		assetBase,
		selectedPetId: initialPetId !== null && initialPetId.length > 0 ? initialPetId : null,
		stateSource,
		desktopWindow,
		onPetChange: (id) => {
			window.__dshPetCurrentId = id;
			bridge?.reportPet(id);
		},
	});
	window.__dshPetApi = api;
	bridge?.onSelectPet((id) => api.selectPet(id));
	bridge?.onSetDebug((enabled) => api.setDebugPanel(enabled));
})();
</script>
</body>
</html>
